name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    # test_app.py connects to a real MongoDB at localhost:27017 and imports
    # `mongo` from app.py — so the Test stage needs an actual MongoDB
    # running alongside it, plus MONGO_URI/SECRET_KEY so app.py can import.
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    env:
      MONGO_URI: mongodb://localhost:27017/studentDB
      SECRET_KEY: ci-dummy-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest test_app.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to EC2
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem
          ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@${{ secrets.EC2_HOST }} << EOF
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.ecr-login.outputs.registry }}
            docker pull $IMAGE
            docker stop flask-app || true
            docker rm flask-app || true
            docker run -d --name flask-app --restart unless-stopped -p 5000:5000 \
              -e MONGO_URI="${{ secrets.MONGO_URI }}" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              $IMAGE
          EOF

      - name: Verify deployment (health check)
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}:5000/health)
            if [ "$STATUS" -eq 200 ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: not healthy yet, retrying..."
            sleep 6
          done
          echo "Health check failed after retries"
          exit 1

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Deployment Succeeded - flask_Practice"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: CI/CD Pipeline
          body: |
            Deployment succeeded.
            Commit SHA: ${{ github.sha }}
            Image: ${{ steps.build-image.outputs.image }}
            Health check: passed

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Deployment Failed - flask_Practice"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: CI/CD Pipeline
          body: |
            Deployment failed.
            Commit SHA: ${{ github.sha }}
            Check which stage broke here:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
